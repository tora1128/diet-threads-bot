name: Threads Auto Reply

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '返信せず対象だけ確認する'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: threads-auto-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USERNAME: mayonaka_letter
      MAX_REPLIES_PER_RUN: '5'
      ROOT_POST_LOOKBACK_DAYS: '7'
      REPLY_LOOKBACK_HOURS: '48'
      DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: コードを取得
        uses: actions/checkout@v5

      - name: Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: シークレット確認
        run: |
          set -euo pipefail
          if [ -z "$THREADS_USER_ID" ]; then echo "ERROR: THREADS_USER_ID が未設定"; exit 1; fi
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then echo "ERROR: THREADS_ACCESS_TOKEN が未設定"; exit 1; fi

      - name: 新着コメントへ返信
        run: python auto_reply.py
