name: Diet Threads Auto Post

on:
  schedule:
    # JST = UTC+9　各スロットでランダム遅延（sleep）を加えて時刻をぼかす
    - cron: '0 22 * * *'   # 07:00 JST
    - cron: '0 2 * * *'    # 11:00 JST
    - cron: '0 6 * * *'    # 15:00 JST
    - cron: '0 10 * * *'   # 19:00 JST
  workflow_dispatch:        # 手動実行ボタン（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: ランダム遅延（0〜59分）
        run: |
          DELAY=$((RANDOM % 3540))
          echo "待機: ${DELAY}秒"
          sleep $DELAY

      - name: Threads に投稿
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_once.py
