name: 星座ランキング Auto Post

on:
  workflow_dispatch:
    inputs:
      post_type:
        description: '投稿タイプ'
        required: true
        default: 'ranking'
        type: choice
        options:
          - ranking
          - morning_message
          - noon_message
      category:
        description: '投稿カテゴリ'
        required: true
        default: '恋愛運'
        type: choice
        options:
          - 恋愛運
          - 総合運
      date_offset:
        description: '日付オフセット（夕方の明日ランキングは1）'
        required: false
        default: ''
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo

    steps:
      - name: コードを取得
        uses: actions/checkout@v5

      - name: Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 実行時刻とカテゴリを決定
        run: |
          echo "実行時刻（JST）: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          POST_TYPE="${{ inputs.post_type }}"
          CAT="${{ inputs.category }}"
          DATE_OFFSET="${{ inputs.date_offset }}"
          echo "POST_TYPE=$POST_TYPE" >> $GITHUB_ENV
          echo "CATEGORY=$CAT" >> $GITHUB_ENV
          echo "DATE_OFFSET=$DATE_OFFSET" >> $GITHUB_ENV
          echo "投稿タイプ: $POST_TYPE"
          echo "カテゴリ: $CAT"
          echo "日付オフセット: ${DATE_OFFSET:-auto}"

      - name: シークレット確認
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ -z "$THREADS_USER_ID" ]; then echo "ERROR: THREADS_USER_ID が未設定"; exit 1; fi
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then echo "ERROR: THREADS_ACCESS_TOKEN が未設定"; exit 1; fi
          echo "シークレット設定OK（USER_ID: ${THREADS_USER_ID:0:4}...）"

      - name: Threads に投稿
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          POST_TYPE: ${{ env.POST_TYPE }}
          CATEGORY: ${{ env.CATEGORY }}
          DATE_OFFSET: ${{ env.DATE_OFFSET }}
        run: |
          if [ -n "$DATE_OFFSET" ]; then
            python post_once.py --post-type "$POST_TYPE" --category "$CATEGORY" --date-offset "$DATE_OFFSET"
          else
            python post_once.py --post-type "$POST_TYPE" --category "$CATEGORY"
          fi
