name: Diet Threads Auto Post

on:
  schedule:
    # 日本時間（JST = UTC+9）で1日4回投稿
    - cron: '0 22 * * *'   # 翌 07:00 JST
    - cron: '0 2 * * *'    # 11:00 JST
    - cron: '0 6 * * *'    # 15:00 JST
    - cron: '0 10 * * *'   # 19:00 JST
  workflow_dispatch:        # 手動実行ボタン（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo        # ログ表示を日本時間に統一

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 現在の日本時間を表示
        run: echo "実行時刻（JST）: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Threads に投稿
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_once.py
