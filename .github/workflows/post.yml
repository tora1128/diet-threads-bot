name: 星座ランキング Auto Post

on:
  workflow_dispatch:
    inputs:
      category:
        description: '投稿カテゴリ'
        required: true
        default: '総合運'
        type: choice
        options:
          - 恋愛運
          - 総合運

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo

    steps:
      - name: コードを取得
        uses: actions/checkout@v5

      - name: Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 実行時刻とカテゴリを決定
        run: |
          echo "実行時刻（JST）: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          CAT="${{ inputs.category }}"
          echo "CATEGORY=$CAT" >> $GITHUB_ENV
          echo "カテゴリ: $CAT"

      - name: シークレット確認
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ -z "$THREADS_USER_ID" ]; then echo "ERROR: THREADS_USER_ID が未設定"; exit 1; fi
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then echo "ERROR: THREADS_ACCESS_TOKEN が未設定"; exit 1; fi
          echo "シークレット設定OK（USER_ID: ${THREADS_USER_ID:0:4}...）"

      - name: Threads に投稿
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          CATEGORY: ${{ env.CATEGORY }}
        run: python post_once.py --category "$CATEGORY"
