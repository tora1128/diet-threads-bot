name: 星座ランキング Auto Post

on:
  schedule:
    - cron: '0 6 * * *'    # 毎日 15:00 JST固定（UTC 7:00）
  workflow_dispatch:        # 手動実行ボタン（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 現在の日本時間を表示
        run: |
          echo "実行時刻（JST）: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: シークレット確認
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ -z "$THREADS_USER_ID" ]; then echo "ERROR: THREADS_USER_ID が未設定"; exit 1; fi
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then echo "ERROR: THREADS_ACCESS_TOKEN が未設定"; exit 1; fi
          echo "シークレット設定OK（USER_ID: ${THREADS_USER_ID:0:4}...）"

      - name: Threads に投稿
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_once.py
